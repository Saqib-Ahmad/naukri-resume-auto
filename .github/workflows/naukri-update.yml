name: Update Naukri Resume

on:
  schedule:
    # Automatic run at 9:00 AM IST
    - cron: '56 9 * * *'
      timezone: 'Asia/Kolkata'

    # Automatic run at 2:00 PM IST
    - cron: '26 15 * * *'
      timezone: 'Asia/Kolkata'

  # Manual trigger for testing/emergency use
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naukri-resume-update
  cancel-in-progress: false

jobs:
  update-naukri:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ==========================================================
      # CHECKOUT REPOSITORY
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # NODE.JS
      # ==========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: npm ci


      # ==========================================================
      # FIREFOX
      # ==========================================================

      - name: Install Firefox
        run: npx playwright install --with-deps firefox


      # ==========================================================
      # RESTORE NAUKRI AUTHENTICATION
      #
      # state.json is NEVER committed to GitHub.
      # It is reconstructed from the GitHub Secret at runtime.
      # ==========================================================

      - name: Restore Naukri authentication
        env:
          NAUKRI_STORAGE_STATE: ${{ secrets.NAUKRI_STORAGE_STATE }}

        shell: bash

        run: |
          set -euo pipefail

          if [ -z "$NAUKRI_STORAGE_STATE" ]; then
            echo "ERROR: NAUKRI_STORAGE_STATE secret is missing."
            exit 1
          fi

          mkdir -p playwright/.auth

          printf '%s' "$NAUKRI_STORAGE_STATE" \
            | base64 --decode \
            > playwright/.auth/state.json

          if [ ! -s playwright/.auth/state.json ]; then
            echo "ERROR: Failed to create Playwright authentication state."
            exit 1
          fi

          echo "Naukri authentication state restored."


      # ==========================================================
      # UPDATE NAUKRI RESUME
      # ==========================================================

      - name: Update Naukri resume
        env:
          HEADLESS: 'false'
          RESUME_PATH: 'resume/SaqibAhmad_ResumeLatest.pdf'
          AUTH_STATE_PATH: 'playwright/.auth/state.json'
          ARTIFACT_DIR: 'artifacts'

        run: |
          xvfb-run --auto-servernum npm run update


      # ==========================================================
      # UPLOAD DEBUG ARTIFACTS
      #
      # Runs even if the Naukri update fails.
      # ==========================================================

      - name: Upload debug artifacts
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: naukri-update-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7


      # ==========================================================
      # REMOVE AUTHENTICATION STATE
      #
      # state.json only exists temporarily on the GitHub runner.
      # ==========================================================

      - name: Remove authentication state
        if: always()

        shell: bash

        run: |
          rm -f playwright/.auth/state.json
          echo "Temporary authentication state removed."