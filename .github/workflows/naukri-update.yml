name: Update Naukri Resume

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-naukri:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Restore Naukri authentication
        env:
          NAUKRI_STORAGE_STATE: ${{ secrets.NAUKRI_STORAGE_STATE }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$NAUKRI_STORAGE_STATE" ]; then
            echo "ERROR: NAUKRI_STORAGE_STATE secret is missing."
            exit 1
          fi

          mkdir -p playwright/.auth

          printf '%s' "$NAUKRI_STORAGE_STATE" \
            | base64 --decode \
            > playwright/.auth/state.json

          if [ ! -s playwright/.auth/state.json ]; then
            echo "ERROR: Failed to create Playwright authentication state."
            exit 1
          fi

          echo "Naukri authentication state restored."

      - name: Update Naukri resume
        env:
          HEADLESS: 'false'
          RESUME_PATH: 'resume/SaqibAhmad_ResumeLatest.pdf'
          AUTH_STATE_PATH: 'playwright/.auth/state.json'
          ARTIFACT_DIR: 'artifacts'
        shell: bash
        run: |
          set -u

          MAX_ATTEMPTS=3

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "========================================"
            echo "Naukri update attempt $attempt of $MAX_ATTEMPTS"
            echo "========================================"

            if xvfb-run --auto-servernum npm run update; then
              echo "Naukri resume update succeeded on attempt $attempt."
              exit 0
            fi

            echo "Naukri resume update failed on attempt $attempt."

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Waiting 20 seconds before retry..."
              sleep 20
            fi
          done

          echo "Naukri resume update failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-update-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove authentication state
        if: always()
        shell: bash
        run: |
          rm -f playwright/.auth/state.json
          echo "Temporary authentication state removed."